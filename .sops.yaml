keys:
  # Personal key (for editing secrets on workstation)
  - &personal age1wq3pdga9uclmyseewafgyrtyyrd764eurnr444uandr6d3k9kfdqlmaqry

  # Host key for trigkey
  - &trigkey age16kn2xl9adz9864vanswgysjtlmecpa7fmmmad2jlg8rdm6rsyylszpn6nd

  # Host key for docker-services LXC container
  - &docker-services age17yqlhhgg7zwvgjk277eu9cdepake0y3zaaz9gkgwcjgkl6d4eguskhzg55

  # Host key for gmktec
  - &gmktec age1jwetf566c3ug2anxaxwsjkxvqwfera7frwn5r0ygsadmvg8ra5jq8xgk8t

  # Host key for m1-mini (nix-darwin host). Derived the same way as the others:
  #   ssh-to-age -i /etc/ssh/ssh_host_ed25519_key.pub
  - &m1-mini age10n50tlxrmrk54v6qph0v9lh7v9hfrlzlk5l6r8yqqf0scdnpkpxs7dc2nf

  # Host key for racknerd (public VPS, Pangolin). Generated on trigkey and
  # placed by nixos-anywhere --extra-files, so secrets decrypt on first boot.
  - &racknerd age1aftecwmn786295d2y2l07td4vhrgem5t0sha0gy4kwt390q7u96sd8jzw7

creation_rules:
  # Default secrets file for all hosts
  - path_regex: secrets/secrets\.yaml$
    key_groups:
      - age:
          - *personal
          - *trigkey
          - *docker-services
          - *gmktec
          - *m1-mini

  # E.T. iOS app push key (APNs .p8), read by et-notify on trigkey.
  # Kept out of secrets.yaml so it could be added from the m1-mini, which can
  # encrypt to these recipients but not decrypt secrets.yaml.
  - path_regex: secrets/et\.yaml$
    key_groups:
      - age:
          - *personal
          - *trigkey

  # racknerd: the public edge. Its own file, so this host never holds a key to
  # secrets.yaml. trigkey is a recipient so deploys and backups can read it.
  - path_regex: secrets/racknerd\.yaml$
    key_groups:
      - age:
          - *personal
          - *trigkey
          - *racknerd

  # Per-host secrets (for future expansion)
  - path_regex: secrets/trigkey/.*\.yaml$
    key_groups:
      - age:
          - *personal
          - *trigkey

  # m1-mini's own secrets. Encrypted to every host, not just m1-mini + personal:
  # the llama-server API key is a *client* credential as much as a server one —
  # anything on the LAN that wants to call the mini's model needs it, so trigkey
  # and gmktec have to be able to read it too.
  - path_regex: secrets/m1-mini/.*\.yaml$
    key_groups:
      - age:
          - *personal
          - *trigkey
          - *docker-services
          - *gmktec
          - *m1-mini

  # Pattern for future hosts: secrets/<hostname>/*.yaml
  # Add more rules here as you add more hosts
