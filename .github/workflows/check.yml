name: Check NixOS config

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Private flake inputs are pulled via git+ssh, one deploy key per repo.
      # For each private input:
      #   1. Generate: ssh-keygen -t ed25519 -f <name>_deploy -C "github-actions"
      #   2. Add <name>_deploy.pub as a deploy key on the source repo
      #   3. Add <name>_deploy (private key) as a secret in this repo
      # webfactory/ssh-agent matches each key to its repo via the embedded marker.
      - name: Set up SSH keys for private flake inputs
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.PIROUSYNC_DEPLOY_KEY }}
            ${{ secrets.BELLE_WATSON_DEPLOY_KEY }}
            ${{ secrets.ETERNATV_DEPLOY_KEY }}

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check formatting (nixfmt-rfc-style)
        run: nix fmt -- --check .

      - name: Check flake (syntax + evaluation)
        run: nix flake check --no-build

      - name: Build docker-services config
        run: nix build .#nixosConfigurations.docker-services.config.system.build.toplevel --no-link

      - name: Build trigkey config
        run: nix build .#nixosConfigurations.trigkey.config.system.build.toplevel --no-link
